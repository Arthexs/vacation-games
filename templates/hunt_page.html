{% extends "base.html" %}

{% block content %}
    <h1>🗺️ Treasure Hunt</h1>
    <div class="progress">Clue {{ current_clue + 1 }} of {{ total_clues }}</div>
    
    <div class="clue-box">
        <h2>{{ clue.question }}</h2>
    </div>
    
    <form method="POST">
        <input type="text" name="answer" placeholder="Enter your answer..." 
               autocomplete="off" autofocus required>
        <button type="submit">Submit Answer</button>
    </form>
    
    <form method="POST" action="{{ url_for('show_hint') }}">
        <button type="submit" class="hint-btn">💡 Need a Hint?</button>
    </form>
    
    {% if hint %}
        <div class="hint">
            <strong>Hint:</strong> {{ hint }}
        </div>
    {% endif %}
    
    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}
{% endblock %}
