{% extends "base.html" %}

{% block content %}
    <div class="treasure">
        <h2>{{ treasure_message }}</h2>
        <p>You completed all {{ total_clues }} clues!</p>
        <form method="POST" action="{{ url_for('reset') }}">
            <button type="submit" class="reset-btn">Start New Hunt</button>
        </form>
    </div>
{% endblock %}
