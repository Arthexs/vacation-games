<!DOCTYPE html>
<html>
<head>
    <title>Final Clue!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="600"> 
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="clue-phone-body">
    <div class="clue-phone-container">
        <h1>🌟 Je Hebt De Clue Gevonden!</h1>
        <p class="instructions">Voer dit bericht exact in op je eigen telefoon om de schat te claimen!</p>
        <div class="code-display">
            {{ clue_code_message }}
        </div>
        <p class="instructions" style="margin-top: 20px;">
            (Scan deze code op je eigen telefoon om terug te keren naar het hoofdspel.)
        </p>
        <div class="qr-box">
            <img src="data:image/png;base64,{{ qr_image }}" alt="QR Code Link to Hunt" width="200" height="200">
        </div>
    </div>
</body>
</html>
