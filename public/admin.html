<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Vacation Games</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="card">
    <h1>Admin</h1>
    <p class="subtitle">Control room — pick a game, start it, end it.</p>

    <div id="startPartySection">
      <p class="subtitle">Waiting for everyone to join on /play...</p>
      <button id="startPartyBtn">Start Party</button>
    </div>

    <div id="activeGameSection" hidden>
      <p class="status-banner active" id="activeGameBanner"></p>
      <!-- Filled by a game's own public/games/<id>/admin.js, if it has one —
           e.g. role assignment, a "Start Timer" button. See src/timer.js and
           adminSocket.js's admin:action handler. -->
      <div id="gameControlSection" hidden></div>
      <button id="endGameBtn">End Game</button>
    </div>

    <div id="gamePickerSection" hidden>
      <h2>Choose a game</h2>
      <ul class="game-list" id="gameList"></ul>
    </div>

    <h2>Leaderboard</h2>
    <ul class="leaderboard-list" id="leaderboard"></ul>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
